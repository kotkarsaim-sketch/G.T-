name: civicgraph

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: civic-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_CONTAINER_PASSWORD:-change-me-dev}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./deploy/neo4j/init:/init:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$NEO4J_AUTH --format plain 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: civic-tei
    command: [--model-id, BAAI/bge-m3, --max-client-batch-size, "32"]
    ports:
      - "8081:80"
    volumes:
      - tei_cache:/data
    restart: unless-stopped

  api:
    build:
      context: ./server
    container_name: civic-api
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_CONTAINER_PASSWORD:-change-me-dev}
      EMBEDDING_BASE_URL: http://embeddings:80
      CIVIC_ENVIRONMENT: ${CIVIC_ENVIRONMENT:-dev}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./samples:/data/samples:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: civic-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  tei_cache:
